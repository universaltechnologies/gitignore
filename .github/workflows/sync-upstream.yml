name: Sync upstream gitignore

on:
  schedule:
    # daily at 21:17 UTC (05:17 next day Beijing time), off the hour to avoid peak load
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Regenerate .gitignore from upstream
        run: python scripts/merge_gitignores.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain .gitignore)" ]]; then
            git config user.name "agent"
            git config user.email "agent@orz.ws"
            git add .gitignore
            git commit -m "gitignore chore: update .gitignore from upstream"
            git push
          else
            echo "upstream unchanged, skip commit"
          fi
